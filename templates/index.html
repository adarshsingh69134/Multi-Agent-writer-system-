<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent Report Writer</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Agent Steps */
        #steps {
            list-style: none;
            padding: 0;
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        #steps li {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
        }
        .step-done {
            background: #d5f2ec;
            border: 1px solid #a8d5e0;
        }
        .step-running {
            background: #fff3cd;
            border: 1px solid #ffd700;
        }
        .step-error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }
        .step-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .step-dot.done { background: #2ecc71; }
        .step-dot.running { background: #ffc107; }
        .step-dot.error { background: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Multi-Agent Report Writer</h1>

        <div class="input-group">
            <label for="topic">Report Topic</label>
            <input type="text" id="topic" placeholder="e.g., Advancements in Quantum Computing">
        </div>

        <div class="input-group">
            <label for="tone">Tone</label>
            <select id="tone">
                <option value="professional">Professional</option>
                <option value="academic">Academic</option>
                <option value="simple">Simple and clear</option>
                <option value="persuasive">Persuasive</option>
            </select>
        </div>

        <div class="input-group">
            <label for="length">Report Length</label>
            <select id="length">
                <option value="short">Short (about 300 words)</option>
                <option value="detailed" selected>Detailed (about 450 words)</option>
                <option value="comprehensive">Comprehensive (about 700 words)</option>
            </select>
        </div>

        <button id="generateBtn" onclick="generateReport()">Generate Report</button>

        <div id="status" style="margin: 15px 0; padding: 10px; background: #ecf0f1; border-radius: 4px; display: none;">
            <span id="statusText">Ready</span>
        </div>

        <div id="progress">
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
        </div>

        <div class="grid grid-2">
            <div class="card">
                <div class="card-bar">Live Agent Activity</div>
                <div class="card-body">
                    <ol id="steps"></ol>
                </div>
            </div>
            <div class="card">
                <div class="card-bar">Activity Log</div>
                <div class="card-body">
                    <ul id="log"></ul>
                </div>
            </div>
        </div>

        <div id="report" style="margin-top: 20px; display: none; padding: 20px; background: #d5f4e3; border-radius: 4px;">
            <div class="report-toolbar">
                <span id="wordCount"></span>
            </div>
            <article id="report-content"></article>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
